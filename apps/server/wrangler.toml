name = "quiproquo-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Static front-end (built apps/web/dist), served by Workers Assets in prod.
# Needs `pnpm --filter web build` to have run first — if apps/web/dist is missing,
# `wrangler dev`/`deploy` will refuse to start. The web app runs on its own Vite dev
# server locally instead, so this only matters for `wrangler deploy`.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- Durable Object: 1 instance per room, adressed by idFromName(roomCode).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# --- D1: question bank + room-code registry.
[[d1_databases]]
binding = "DB"
database_name = "quiproquo-db"
database_id = "c0a7dbc3-95a6-4135-89a2-cd97e56b3434"
migrations_dir = "migrations"

# --- R2: question media (images/audio/video). Not enabled on the account yet —
# the 15 audio questions (thèmes animaux/cuisine) are inert without it, everything
# else works fine. Uncomment once `wrangler r2 bucket create quiproquo-media` succeeds.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "quiproquo-media"

[vars]
ADMIN_SECRET = "dev-secret-change-me"
